---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Keeps pinned pre-commit hooks (ruff, rstcheck) up to date. Dependabot opens
  # a PR when a hook's rev has a new release, and CI runs on that PR.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
